<!DOCTYPE html>
<html lang="es">
<head>

<script>
(function(){
  var md=navigator.mediaDevices; if(!md||!md.getUserMedia) return;
  var orig=md.getUserMedia.bind(md);
  md.getUserMedia=function(c){
    if(c&&c.video){ if(c.video===true) c.video={}; c.video.width={ideal:1920}; c.video.height={ideal:1080}; }
    return orig(c);
  };
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script>
/* Caja redondeada con volumen (extrusión con bisel) */
AFRAME.registerComponent("rrect", {
  schema: { w:{default:1}, h:{default:1}, r:{default:0.05}, depth:{default:0.05}, bevel:{default:0.008}, color:{default:"#fff"}, rough:{default:0.55}, metal:{default:0.1} },
  init: function () {
    const T = AFRAME.THREE, d = this.data, b = d.bevel;
    const w = d.w - 2*b, h = d.h - 2*b, r = Math.max(0.001, d.r - b), x = -w/2, y = -h/2;
    const sh = new T.Shape();
    sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r);
    sh.lineTo(x + w, y + h - r); sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    sh.lineTo(x + r, y + h); sh.quadraticCurveTo(x, y + h, x, y + h - r);
    sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y);
    const geo = new T.ExtrudeGeometry(sh, { depth: d.depth, bevelEnabled: b > 0, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 10 });
    const mat = new T.MeshStandardMaterial({ color: d.color, roughness: d.rough, metalness: d.metal });
    this.el.setObject3D("mesh", new T.Mesh(geo, mat));
  }
});
/* Destello de 4 puntas */
AFRAME.registerComponent("star4", {
  schema: { color:{default:"#ffd77a"}, inner:{default:0.22} },
  init: function () {
    const T = AFRAME.THREE, sh = new T.Shape();
    for (let k = 0; k < 8; k++) {
      const a = Math.PI/2 + k*Math.PI/4, rad = (k % 2 === 0) ? 1 : this.data.inner;
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if (k === 0) sh.moveTo(px, py); else sh.lineTo(px, py);
    }
    sh.closePath();
    const mat = new T.MeshBasicMaterial({ color: this.data.color, side: T.DoubleSide, transparent: true });
    this.el.setObject3D("mesh", new T.Mesh(new T.ShapeGeometry(sh), mat));
  }
});
</script>
<style>
  html { background:#1c0a33; }
  body { background:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; font-family:'Plus Jakarta Sans', system-ui, sans-serif; }
  button { font-family:inherit; }

  /* ---------- Portada con cargador del video ---------- */
  #start { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;
    background: radial-gradient(circle at 50% 30%, #5b21b6 0%, #1c0a33 72%); color:#fff; }
  #start h1 { font-size:28px; font-weight:700; letter-spacing:.2px; margin:0 0 10px; }
  #start p  { color:#e9ddff; margin:0 0 22px; max-width:300px; line-height:1.5; font-size:15px; }
  #loadwrap { width:min(80vw,320px); margin:0 0 26px; text-align:center; transition:opacity .5s; }
  #pct { font-size:64px; font-weight:800; line-height:1; letter-spacing:-1px; color:#fff; }
  #loadbar { height:12px; border-radius:8px; background:rgba(255,255,255,.22); overflow:hidden; margin-top:14px; }
  #loadfill { height:100%; width:0%; border-radius:8px; background:#fff; transition:width .15s linear; }
  #loadtxt { margin-top:10px; font-size:14px; font-weight:600; color:#e9ddff; }
  #startBtn { font-size:17px; font-weight:600; padding:14px 30px; border-radius:30px; border:1px solid #fff; background:rgba(255,255,255,.14); color:#fff; letter-spacing:.3px; min-width:220px; }
  #startBtn:disabled { opacity:.5; }

  /* ---------- Recuadro guía + tooltip (siempre en formato tooltip) ---------- */
  #reticle { position:fixed; z-index:9; left:50%; top:44%; width:72vw; max-width:360px; aspect-ratio:3/2; transform:translate(-50%,-50%);
    border:3px dashed rgba(255,255,255,.9); border-radius:18px; box-shadow:0 0 0 2px rgba(91,33,182,.7); pointer-events:none; display:none; transition:border-color .25s, box-shadow .25s; }
  #reticle.found { border-color:transparent; box-shadow:none; }   /* el recuadro se oculta pero el tooltip se queda */
  #tip { position:absolute; left:50%; top:calc(100% + 16px); transform:translateX(-50%); width:max-content; max-width:80vw; box-sizing:border-box; text-align:center;
    background:#fff; color:#4c1d95; font-weight:600; font-size:14px; line-height:1.35; padding:10px 16px; border-radius:14px; box-shadow:0 6px 18px rgba(28,10,51,.45); }
  #tip::before { content:""; position:absolute; left:50%; top:-9px; margin-left:-10px; border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:10px solid #fff; }
  #badge { position:fixed; z-index:12; top:16px; left:50%; transform:translateX(-50%); padding:9px 18px; border-radius:24px; font-weight:600; font-size:15px;
    background:rgba(76,29,149,.88); color:#fff; border:1px solid #fff; display:none; pointer-events:none; white-space:nowrap; }
  #badge.ok { background:#fff; color:#4c1d95; border-color:#c4b5fd; }

  #full { position:fixed; inset:0; z-index:30; background:#000; display:none; align-items:center; justify-content:center; }
  #full video { width:100%; height:100%; object-fit:contain; background:#000; }
  #close { position:absolute; top:14px; right:14px; z-index:31; width:44px; height:44px; border-radius:50%; border:1px solid #fff; background:rgba(76,29,149,.9); color:#fff; font-size:24px; line-height:1; }
  #debug { position:fixed; top:8px; left:8px; z-index:10; color:#c4b5fd; font:11px monospace; }
</style>
</head>
<body>
<div id="start">
  <h1>Momento 4 · TV 3D</h1>
  <p id="startMsg">Preparando la experiencia…</p>
  <div id="loadwrap">
    <div id="pct">0%</div>
    <div id="loadbar"><div id="loadfill"></div></div>
    <div id="loadtxt">Cargando video…</div>
  </div>
  <button id="startBtn" style="display:none">Reintentar</button>
</div>
<div id="reticle"><div id="tip">Abriendo cámara…</div></div>
<div id="badge">Buscando la imagen…</div>
<div id="full">
  <button id="close" aria-label="Cerrar">&times;</button>
  <video id="vidFull" playsinline webkit-playsinline controls></video>
</div>
<div id="debug"></div>

<a-scene id="scene"
  mindar-image="imageTargetSrc: ./momento4v2.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF:0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 10;"
  color-space="sRGB" renderer="colorManagement: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Marcador: ancho = 1, alto = 445/662 = 0.672, origen = centro de la imagen.
       Pantalla del televisor medida sobre la ilustración: centro (-0.023, 0.002), 0.334 x 0.251 -->
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-light type="ambient" color="#ffffff" intensity="0.55"></a-light>
    <a-light type="directional" color="#fff4e0" intensity="0.55" position="-0.6 1 1.5"></a-light>
    <a-light type="point" color="#b388ff" intensity="0.35" distance="1.2" position="0.3 -0.2 0.5"></a-light>

    <!-- resplandor mágico detrás del televisor -->
    <a-image id="glow" position="-0.0099 -0.0198 -0.01" width="1.1" height="0.9" material="blending:additive; transparent:true; depthWrite:false; shader:flat"
      animation="property: scale; from: 0.92 0.92 0.92; to: 1.08 1.08 1.08; dur: 2200; dir: alternate; loop: true; easing: easeInOutSine"></a-image>

    <!-- TELEVISOR 3D (se infla al detectar la imagen) -->
    <a-entity id="tv" scale="0.01 0.01 0.01"
      animation__pop="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 1100; easing: easeOutElastic; startEvents: pop">

      <!-- cuerpo -->
      <a-entity rrect="w:0.5772; h:0.4064; r:0.045; depth:0.12; bevel:0.012; color:#7a55b8; rough:0.45; metal:0.15" position="-0.0099 -0.0198 -0.003"></a-entity>
      <!-- marco interior y recuadro hundido -->
      <a-entity rrect="w:0.4269; h:0.3415; r:0.05; depth:0.004; bevel:0.003; color:#4b2a86; rough:0.5" position="-0.0219 -0.0161 0.133"></a-entity>
      <a-entity rrect="w:0.3996; h:0.3142; r:0.048; depth:0.004; bevel:0.002; color:#22094a; rough:0.3" position="-0.0184 -0.0126 0.138"></a-entity>
      <!-- tira lateral izquierda -->
      <a-entity rrect="w:0.0314; h:0.3313; r:0.01; depth:0.004; bevel:0.002; color:#5d3d99" position="-0.2561 -0.0126 0.132"></a-entity>

      <!-- pantalla: fondo + video vertical 9:16 -->
      <a-plane position="-0.0184 -0.0126 0.1435" width="0.3825" height="0.2971" material="color:#2e1065; shader:flat"></a-plane>
      <a-plane id="avideo" position="-0.0184 -0.0126 0.1445" width="0.1671" height="0.2971" material="shader:flat; color:#2e1065"></a-plane>

      <!-- panel de controles -->
      <a-entity rrect="w:0.0533; h:0.0936; r:0.012; depth:0.006; bevel:0.002; color:#f2a65a; rough:0.4; metal:0.3" position="0.222 0.1028 0.132"></a-entity>
      <a-cylinder radius="0.0137" height="0.012" rotation="90 0 0" position="0.2206 0.1199 0.142" color="#d6c4f5" metalness="0.4" roughness="0.35"></a-cylinder>
      <a-cylinder radius="0.0137" height="0.012" rotation="90 0 0" position="0.2206 0.0809 0.142" color="#d6c4f5" metalness="0.4" roughness="0.35"></a-cylinder>
      <a-cylinder radius="0.0273" height="0.01" rotation="90 0 0" position="0.2213 0.0242 0.136" color="#4b2a86"></a-cylinder>
      <a-cylinder radius="0.0225" height="0.016" rotation="90 0 0" position="0.2213 0.0242 0.141" color="#d6c4f5" metalness="0.4" roughness="0.35"
        animation="property: rotation; from: 90 0 0; to: 90 360 0; dur: 8000; loop: true; easing: linear"></a-cylinder>
      <!-- rejilla del altavoz -->
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.0181 0.133" color="#3d2070"></a-box>
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.0348 0.133" color="#3d2070"></a-box>
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.0516 0.133" color="#3d2070"></a-box>
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.0683 0.133" color="#3d2070"></a-box>
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.085 0.133" color="#3d2070"></a-box>
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.1018 0.133" color="#3d2070"></a-box>
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.1185 0.133" color="#3d2070"></a-box>
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.1352 0.133" color="#3d2070"></a-box>
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.152 0.133" color="#3d2070"></a-box>
      <a-box width="0.0492" height="0.006" depth="0.005" position="0.222 -0.1687 0.133" color="#3d2070"></a-box>
      <!-- patas -->
      <a-cylinder radius="0.015" height="0.03" position="-0.237 -0.2333 0.07" color="#3b1f6b"></a-cylinder>
      <a-cylinder radius="0.015" height="0.03" position="0.1933 -0.2333 0.07" color="#3b1f6b"></a-cylinder>

      <!-- botón de reproducir sobre el video en pausa -->
      <a-circle id="playIcon" position="-0.0184 -0.0126 0.16" radius="0.034" material="color:#ffffff; shader:flat; transparent:true; opacity:0.92"></a-circle>
      <a-triangle position="-0.0144 -0.0126 0.161" vertex-a="0 0.016 0" vertex-b="-0.014 -0.016 0" vertex-c="0.014 -0.016 0" rotation="0 0 -90"
        material="color:#5b21b6; shader:flat"></a-triangle>

      <!-- manito animada -->
      <a-entity id="handG" visible="false">
        <a-ring position="-0.0184 -0.0126 0.17" radius-inner="0.016" radius-outer="0.024" material="color:#ffffff; shader:flat; transparent:true; opacity:0"
          animation__s="property: scale; from: 0.3 0.3 0.3; to: 2.4 2.4 2.4; dur: 1400; loop: true; easing: easeOutQuad"
          animation__o="property: material.opacity; from: 1; to: 0; dur: 1400; loop: true; easing: easeInQuad"></a-ring>
        <a-ring position="-0.0184 -0.0126 0.169" radius-inner="0.024" radius-outer="0.03" material="color:#7c3aed; shader:flat; transparent:true; opacity:0"
          animation__s="property: scale; from: 0.3 0.3 0.3; to: 2.4 2.4 2.4; dur: 1400; loop: true; easing: easeOutQuad"
          animation__o="property: material.opacity; from: 1; to: 0; dur: 1400; loop: true; easing: easeInQuad"></a-ring>
        <a-image id="handImg" width="0.2" height="0.2" position="-0.0144 -0.0876 0.18"
          animation="property: position; from: -0.0144 -0.1126 0.18; to: -0.0144 -0.0876 0.18; dur: 650; dir: alternate; loop: true; easing: easeInOutSine"></a-image>
      </a-entity>

      <!-- anillo plateado que gira alrededor del televisor -->
      <a-entity position="-0.0099 -0.0198 0.07" animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 9000; loop: true; easing: linear">
        <a-torus radius="0.39" radius-tubular="0.005" segments-tubular="72" rotation="0 0 12" scale="1 0.5 1"
          material="color:#e8e2fa; metalness:0.8; roughness:0.25; emissive:#b9a8ee; emissiveIntensity:0.5"></a-torus>
      </a-entity>

      <!-- destellos dorados (se agregan por código) -->
      <a-entity id="magic"></a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
const VIDEO_URL = "./momento4.mp4";
const POSTER = 1.0;          // segundo del video que se muestra en pausa dentro del televisor
const scene = document.querySelector("#scene");
const target = document.querySelector("#target");
const avideo = document.querySelector("#avideo");
const vidFull = document.querySelector("#vidFull");
const handG = document.querySelector("#handG");
const tip = document.querySelector("#tip");
const reticle = document.querySelector("#reticle"), badge = document.querySelector("#badge");
const dbg = document.querySelector("#debug");
const startBtn = document.querySelector("#startBtn");
const pctEl = document.querySelector("#pct"), loadfill = document.querySelector("#loadfill"), loadtxt = document.querySelector("#loadtxt"), loadwrap = document.querySelector("#loadwrap");
const setTip = (t) => { tip.textContent = t; };

/* ---------- Imagen de la manito (se dibuja una vez en un canvas) ---------- */
(function makeHand() {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"); g.scale(256 / 24, 256 / 24);
  const p = new Path2D("M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z");
  g.lineJoin = "round"; g.lineWidth = 1.5; g.strokeStyle = "#5b21b6"; g.fillStyle = "#ffffff";
  g.stroke(p); g.fill(p);
  document.querySelector("#handImg").setAttribute("src", c.toDataURL("image/png"));
})();


/* ---------- Magia: resplandor, destellos y partículas ---------- */
(function buildMagic() {
  const g = document.createElement("canvas"); g.width = g.height = 256;
  const x = g.getContext("2d"), gr = x.createRadialGradient(128,128,10,128,128,128);
  gr.addColorStop(0,"rgba(176,132,255,.75)"); gr.addColorStop(.5,"rgba(124,58,237,.30)"); gr.addColorStop(1,"rgba(60,20,120,0)");
  x.fillStyle = gr; x.fillRect(0,0,256,256);
  document.querySelector("#glow").setAttribute("src", g.toDataURL("image/png"));

  const magic = document.querySelector("#magic");
  const stars = [[-0.33,0.2,0.16,0.045],[0.34,0.22,0.12,0.035],[-0.36,-0.1,0.22,0.03],[0.37,-0.12,0.18,0.04],[0.05,0.3,0.2,0.032],[-0.15,-0.27,0.24,0.028],[0.25,0.05,0.3,0.024]];
  stars.forEach((s, i) => {
    const e = document.createElement("a-entity");
    e.setAttribute("star4", "color: " + (i % 3 === 0 ? "#ffe9a8" : "#ffd77a"));
    e.setAttribute("position", s[0] + " " + s[1] + " " + s[2]);
    e.setAttribute("scale", s[3] + " " + s[3] + " " + s[3]);
    e.setAttribute("animation__t", "property: scale; from: " + (s[3]*0.3) + " " + (s[3]*0.3) + " " + (s[3]*0.3) + "; to: " + s[3] + " " + s[3] + " " + s[3] + "; dur: " + (900 + i*170) + "; dir: alternate; loop: true; easing: easeInOutSine");
    e.setAttribute("animation__r", "property: rotation; from: 0 0 0; to: 0 0 90; dur: " + (3000 + i*400) + "; dir: alternate; loop: true; easing: easeInOutSine");
    e.setAttribute("animation__f", "property: position; from: " + s[0] + " " + s[1] + " " + s[2] + "; to: " + s[0] + " " + (s[1] + 0.03) + " " + (s[2] + 0.03) + "; dur: " + (2200 + i*250) + "; dir: alternate; loop: true; easing: easeInOutSine");
    magic.appendChild(e);
  });
  // partículas que suben del televisor
  for (let i = 0; i < 26; i++) {
    const p = document.createElement("a-sphere");
    const px = (Math.random() - 0.5) * 0.6, pz = 0.05 + Math.random() * 0.25, r = 0.0025 + Math.random() * 0.003;
    p.setAttribute("radius", r);
    p.setAttribute("material", "shader:flat; color:" + (Math.random() > 0.5 ? "#ffe9a8" : "#e9ddff") + "; transparent:true");
    p.setAttribute("position", px + " -0.2 " + pz);
    p.setAttribute("animation", "property: position; from: " + px + " -0.2 " + pz + "; to: " + (px + (Math.random()-0.5)*0.12) + " 0.32 " + pz + "; dur: " + (3000 + Math.random()*3500) + "; delay: " + Math.floor(Math.random()*4000) + "; loop: true; easing: easeOutSine");
    magic.appendChild(p);
  }
})();
const tvEl = document.querySelector("#tv");

// Video usado como textura dentro de la escena
const vid = document.createElement("video");
vid.loop = true; vid.playsInline = true; vid.setAttribute("webkit-playsinline", ""); vid.preload = "auto";
vid.style.cssText = "position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none";
document.body.appendChild(vid);

// El video de la escena siempre va en silencio (los celulares solo permiten sonido tras un toque);
// el sonido se activa al abrir el video en pantalla completa, que sí nace de un toque.
vid.muted = true; vid.setAttribute("muted", "");

let found = false, fullOpen = false, handDone = false, lostTimer = null;
let sceneReady = false, videoReady = false, started = false;

/* Contador suave: avanza de a 1 % cada ~28 ms (mínimo ~2.8 s) y nunca pasa del progreso real */
let target_pct = 0, shown = 0, shownDone = false;
function setPct(n) { pctEl.textContent = n + "%"; loadfill.style.width = n + "%"; }
setInterval(() => {
  if (shownDone) return;
  if (shown < target_pct) { shown++; setPct(shown); }
  if (shown >= 100) { shownDone = true; loadtxt.textContent = "¡Video listo! ✓"; setTimeout(maybeStart, 700); }
}, 28);
function maybeStart() { if (sceneReady && videoReady && shownDone && !started) startAR(); }
if (scene.hasLoaded) { sceneReady = true; } else scene.addEventListener("loaded", () => { sceneReady = true; maybeStart(); });

/* ---------- Carga del video con porcentaje (0–100 %) ---------- */
async function loadVideo() {
  try {
    dbg.textContent = "descargando…";
    const res = await fetch(VIDEO_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const total = parseInt(res.headers.get("content-length") || "0", 10) || 2561861;   // tamaño conocido si el servidor no lo informa
    const reader = res.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      if (total) {
        const pct = Math.min(99, Math.floor(got / total * 100));
        target_pct = Math.max(target_pct, Math.min(95, pct));
      } else {
        pctEl.textContent = "…";
      }
    }
    const url = URL.createObjectURL(new Blob(chunks, { type: "video/mp4" }));
    vid.src = url; vidFull.src = url;
    dbg.textContent = "descargado, preparando…";
    await new Promise((ok, fail) => {
      vid.addEventListener("loadeddata", ok, { once: true });
      vid.addEventListener("loadedmetadata", ok, { once: true });
      vid.addEventListener("error", () => fail(new Error("video")), { once: true });
      setTimeout(ok, 4000);          // si el celular no precarga el video, seguimos igual
      vid.load();
    });
    vidFull.load();
    // dejar el video de la escena en pausa mostrando un cuadro representativo
    vid.currentTime = POSTER;
    await new Promise(ok => { vid.addEventListener("seeked", ok, { once: true }); setTimeout(ok, 1500); });
    try { await Promise.race([vid.play(), new Promise(r => setTimeout(r, 1500))]); vid.pause(); } catch (e) {}      // (en silencio) fuerza que se decodifique el cuadro
    vid.currentTime = POSTER;
    avideo.setAttribute("material", "src", vid);
    avideo.setAttribute("material", "color", "#ffffff");
    target_pct = 100;
    videoReady = true; maybeStart();
  } catch (e) {
    pctEl.textContent = "⚠";
    loadtxt.textContent = "No se pudo cargar el video. Revisa tu conexión y recarga la página.";
    startBtn.style.display = "inline-block"; startBtn.textContent = "Reintentar";
    dbg.textContent = String(e);
  }
}
loadVideo();

/* ---------- Inicio automático (sin botón) ---------- */
function startAR() {
  started = true;
  const st = document.querySelector("#start");
  st.style.transition = "opacity .5s"; st.style.opacity = 0;
  setTimeout(() => { st.style.display = "none"; }, 500);
  reticle.style.display = "block"; badge.style.display = "block";
  setTip("Abriendo cámara…");
  const fail = (msg, e) => {
    setTip(msg); dbg.textContent = String(e || "");
    // si algo falla, se vuelve a mostrar la portada con un botón para reintentar (un toque del usuario)
    st.style.display = "flex"; st.style.opacity = 1; loadwrap.style.display = "none";
    document.querySelector("#startMsg").textContent = msg;
    startBtn.style.display = "inline-block"; startBtn.textContent = "Reintentar";
    started = false;
  };
  try {
    Promise.resolve(scene.systems["mindar-image-system"].start()).then(() => {
      if (!found) setTip("Centra la imagen del televisor dentro del recuadro");
    }).catch(e => fail("No se pudo abrir la cámara. Revisa los permisos.", e));
  } catch (e) { fail("Error al iniciar. Recarga la página.", e); }
}
startBtn.addEventListener("click", () => { startBtn.style.display = "none"; startAR(); });

target.addEventListener("targetFound", () => {
  found = true;
  tvEl.setAttribute("scale", "0.01 0.01 0.01"); tvEl.emit("pop");      // el televisor "se infla" al detectarlo
  clearTimeout(lostTimer);
  reticle.classList.add("found");
  badge.classList.add("ok"); badge.textContent = "✓ ¡Imagen detectada!";
  setTip("Toca el televisor para ver el video en pantalla completa");
  if (navigator.vibrate) navigator.vibrate(60);
  if (!handDone) handG.setAttribute("visible", true);
});
target.addEventListener("targetLost", () => {
  found = false;
  reticle.classList.remove("found");
  badge.classList.remove("ok"); badge.textContent = "Buscando la imagen…";
  setTip("Centra la imagen del televisor dentro del recuadro");
  handG.setAttribute("visible", false);
});

function openFull() {
  fullOpen = true; handDone = true;
  handG.setAttribute("visible", false);
  // continúa donde quedó; solo reinicia si ya había terminado
  if (vidFull.ended || (vidFull.duration && vidFull.currentTime >= vidFull.duration - 0.3)) vidFull.currentTime = 0;
  document.querySelector("#full").style.display = "flex";
  vidFull.muted = false;
  vidFull.play().catch(() => {});
}
function closeFull() {
  fullOpen = false;
  vidFull.pause();
  document.querySelector("#full").style.display = "none";   // en la escena el video sigue en pausa
}
scene.addEventListener("click", () => { if (found && !fullOpen) openFull(); });
document.querySelector("#close").addEventListener("click", (e) => { e.stopPropagation(); closeFull(); });
</script>
