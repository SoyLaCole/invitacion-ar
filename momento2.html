<script>
/* Caja redondeada con volumen (extrusión con bisel) */
AFRAME.registerComponent("rrect", {
  schema: { w:{default:1}, h:{default:1}, r:{default:0.05}, depth:{default:0.05}, bevel:{default:0.008}, color:{default:"#fff"}, rough:{default:0.55}, metal:{default:0.1} },
  init: function () {
    const T = AFRAME.THREE, d = this.data, b = d.bevel;
    const w = d.w - 2*b, h = d.h - 2*b, r = Math.max(0.001, d.r - b), x = -w/2, y = -h/2;
    const sh = new T.Shape();
    sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r);
    sh.lineTo(x + w, y + h - r); sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    sh.lineTo(x + r, y + h); sh.quadraticCurveTo(x, y + h, x, y + h - r);
    sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y);
    const geo = new T.ExtrudeGeometry(sh, { depth: d.depth, bevelEnabled: b > 0, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 10 });
    const mat = new T.MeshStandardMaterial({ color: d.color, roughness: d.rough, metalness: d.metal });
    this.el.setObject3D("mesh", new T.Mesh(geo, mat));
  }
});
/* Destello de 4 puntas */
AFRAME.registerComponent("star4", {
  schema: { color:{default:"#ffd77a"}, inner:{default:0.22} },
  init: function () {
    const T = AFRAME.THREE, sh = new T.Shape();
    for (let k = 0; k < 8; k++) {
      const a = Math.PI/2 + k*Math.PI/4, rad = (k % 2 === 0) ? 1 : this.data.inner;
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if (k === 0) sh.moveTo(px, py); else sh.lineTo(px, py);
    }
    sh.closePath();
    const mat = new T.MeshBasicMaterial({ color: this.data.color, side: T.DoubleSide, transparent: true });
    this.el.setObject3D("mesh", new T.Mesh(new T.ShapeGeometry(sh), mat));
  }
});
</script>
<script>
/* Nota musical 3D: variant 0 = corchea, 1 = dos corcheas unidas */
AFRAME.registerComponent("note3d", {
  schema: { color:{default:"#ffd77a"}, variant:{default:0} },
  init: function () {
    const T = AFRAME.THREE, C = (AFRAME.__noteCache = AFRAME.__noteCache || { geo:{}, mat:{} });
    const v = this.data.variant;
    if (!C.geo[v]) {
      const shapes = [];
      const head = (cx, cy) => { const s = new T.Shape(); s.absellipse(cx, cy, 0.62, 0.43, 0, Math.PI*2, false, -0.35); return s; };
      const stem = (x, y0, y1) => { const s = new T.Shape(); s.moveTo(x, y0); s.lineTo(x+0.17, y0); s.lineTo(x+0.17, y1); s.lineTo(x, y1); s.closePath(); return s; };
      if (v === 0) {
        shapes.push(head(0, 0), stem(0.46, 0, 2.7));
        const f = new T.Shape(); f.moveTo(0.63, 2.7); f.bezierCurveTo(1.05, 2.35, 1.8, 2.0, 1.4, 0.95); f.bezierCurveTo(1.5, 1.9, 1.0, 2.1, 0.63, 1.95); f.closePath(); shapes.push(f);
      } else {
        shapes.push(head(0, 0), head(1.75, -0.35), stem(0.46, 0, 2.6), stem(2.21, -0.35, 2.25));
        const b = new T.Shape(); b.moveTo(0.46, 2.6); b.lineTo(2.38, 2.25); b.lineTo(2.38, 1.75); b.lineTo(0.46, 2.1); b.closePath(); shapes.push(b);
      }
      const geo = new T.ExtrudeGeometry(shapes, { depth: 0.3, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 2, curveSegments: 14 });
      geo.center(); C.geo[v] = geo;
    }
    const col = this.data.color;
    if (!C.mat[col]) C.mat[col] = new T.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.6, roughness: 0.35, metalness: 0.3 });
    this.el.setObject3D("mesh", new T.Mesh(C.geo[v], C.mat[col]));
  }
});
</script>

<body>
<div id="start">
  <h1>Momento 2</h1>
  <p id="startMsg">Preparando la experiencia…</p>
  <div id="loadwrap">
    <div id="pct">0%</div>
    <div id="loadbar"><div id="loadfill"></div></div>
    <div id="loadtxt">Cargando…</div>
  </div>
  <button id="startBtn" style="display:none">Reintentar</button>
</div>
<div id="reticle"><div id="tip">Abriendo cámara…</div></div>
<div id="badge">Buscando la imagen…</div>
<div id="debug"></div>

<a-scene id="scene"
  mindar-image="imageTargetSrc: ./momento2v2.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF:0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 10;"
  color-space="sRGB" renderer="colorManagement: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- Marcador: ancho = 1, alto = 622/1000 = 0.622, origen = centro de la imagen (la fachada) -->
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.7" position="-0.5 1 1.5"></a-light>

    <a-entity id="world">
      <!-- Plano 3 (fondo): nubes, un poco más grandes que la impresión para taparla -->
      <a-entity id="back" position="0 0 -0.07" scale="1.08 1.08 1.08">
        <a-image id="backImg" width="1" height="0.6216" material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
        <a-entity id="twinkles"></a-entity>
      </a-entity>

      <!-- Plano 2 (medio): la fachada, se despega de la página al detectarla -->
      <a-entity id="fac" position="0 0 0.003"
        animation__rise="property: position; to: 0 0 0.16; dur: 1400; easing: easeOutElastic; startEvents: rise"
        animation__grow="property: scale; from: 1 1 1; to: 0.9 0.9 0.9; dur: 1400; easing: easeOutElastic; startEvents: rise">
        <a-image id="facImg" width="1" height="0.6216" material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
        <a-image id="glow" position="-0.119 -0.02 0.004" width="0.4" height="0.2" material="blending:additive; transparent:true; depthWrite:false; shader:flat"
          animation="property: scale; from: 0.9 0.9 0.9; to: 1.12 1.12 1.12; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine"></a-image>
        <a-entity id="lights"></a-entity>
      </a-entity>

      <!-- Plano 1 (frente): notas musicales por toda la pantalla -->
      <a-entity id="notes"></a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
/* ============ Canción ============
   Para usar la canción real, sube el archivo (p. ej. cancion.mp3) y escribe aquí su ruta: AUDIO_URL = "./cancion.mp3".
   Mientras tanto suena una melodía sintetizada de prueba. */
const AUDIO_URL = "";
const mf = (m) => 440 * Math.pow(2, (m - 69) / 12);
const THEME = { tempo: 92, wave: "triangle", dec: 0.9,
  steps: [76,null,79,null,81,79,76,null,74,null,77,null,79,77,74,null,72,null,76,null,79,76,72,null,74,null,71,null,72,null,null,null],
  pads: [[48,55,64],[45,52,60],[41,48,57],[43,50,59]] };
let ac = null, master = null, songNode = null, songTimer = null, songAudio = null;
let playing = false, userPaused = false, blocked = false, synthStarted = false;
function audioInit() {
  if (!AUDIO_URL) {
    if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination); }
  }
}
function tone(dest, freq, t, dur, type, vol, atk) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function startSynth() {
  if (synthStarted) return; synthStarted = true;
  songNode = ac.createGain(); songNode.gain.setValueAtTime(0, ac.currentTime); songNode.gain.linearRampToValueAtTime(1, ac.currentTime + 1.5); songNode.connect(master);
  const stepDur = 60 / THEME.tempo / 2; let step = 0, next = ac.currentTime + 0.1;
  const tick = () => {
    while (next < ac.currentTime + 0.5) {
      const n = THEME.steps[step % THEME.steps.length];
      if (n != null) { tone(songNode, mf(n), next, THEME.dec, THEME.wave, 0.16, 0.012); tone(songNode, mf(n) * 2.01, next, THEME.dec * 0.6, "sine", 0.04, 0.01); }
      if (step % 8 === 0) THEME.pads[Math.floor(step / 8) % THEME.pads.length].forEach(m => tone(songNode, mf(m), next, stepDur * 8.5, "sine", 0.05, 0.6));
      next += stepDur; step++;
    }
  };
  tick(); songTimer = setInterval(tick, 150);
}
/* Reproducir o reanudar. Si el navegador no deja sonar sin un toque, queda "blocked" y el primer toque la activa. */
function songPlay() {
  userPaused = false;
  if (AUDIO_URL) {
    if (!songAudio) { songAudio = new Audio(AUDIO_URL); songAudio.loop = true; songAudio.volume = 0.9; }
    songAudio.play().then(() => { playing = true; blocked = false; refreshTip(); }).catch(() => { playing = false; blocked = true; refreshTip(); });
  } else {
    audioInit(); startSynth();
    const done = () => { if (ac.state === "running") { playing = true; blocked = false; } else { playing = false; blocked = true; } refreshTip(); };
    ac.resume().then(done).catch(done);
    setTimeout(() => { if (!userPaused && ac.state !== "running") { playing = false; blocked = true; refreshTip(); } }, 700);
  }
}
function songPause() {
  userPaused = true; playing = false;
  if (AUDIO_URL) { if (songAudio) songAudio.pause(); } else if (ac) ac.suspend();
  refreshTip();
}
function songLevel(v, secs) {
  if (AUDIO_URL) { if (songAudio) songAudio.volume = v; return; }
  if (!ac || !master) return;
  const now = ac.currentTime; master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value, now); master.gain.linearRampToValueAtTime(v, now + secs);
}
</script>

<script>
const scene = document.querySelector("#scene");
const target = document.querySelector("#target");
const world = document.querySelector("#world");
const notesEl = document.querySelector("#notes"), lightsEl = document.querySelector("#lights"), twEl = document.querySelector("#twinkles"), fac = document.querySelector("#fac");
const tip = document.querySelector("#tip");
const reticle = document.querySelector("#reticle"), badge = document.querySelector("#badge");
const dbg = document.querySelector("#debug");
const startBtn = document.querySelector("#startBtn");
const pctEl = document.querySelector("#pct"), loadfill = document.querySelector("#loadfill"), loadtxt = document.querySelector("#loadtxt");
const setTip = (html) => { tip.innerHTML = html; };
let found = false, started = false, sceneReady = false, shownDone = false, lostTimer = null, noteTimer = null;

/* Ventanas de la fachada (coordenadas sobre la ilustración: ancho = 1, origen al centro) */
const WINDOWS = [[-0.3028,0.0203],[-0.2477,0.047],[-0.1957,0.0722],[-0.1391,0.1044],[-0.0489,0.1518],[-0.3104,-0.0348],[0.2187,0.0852],[0.2668,0.0585],[0.2072,0.034],[0.2722,0.0034],[0.0833,-0.0715],[0.1613,-0.0906],[0.2217,-0.1059],[0.2699,-0.1174],[-0.1888,-0.1693],[-0.1346,-0.1655],[-0.0772,-0.1609],[-0.0199,-0.1563],[-0.2592,-0.1135],[-0.3685,-0.1441],[-0.2592,-0.1938]];
const NOTE_COLORS = ["#ffd77a", "#ffe9a8", "#ffffff", "#e9ddff", "#f0abfc"];

/* resplandor del letrero */
(function () {
  const g = document.createElement("canvas"); g.width = g.height = 256;
  const x = g.getContext("2d"), gr = x.createRadialGradient(128,128,8,128,128,128);
  gr.addColorStop(0,"rgba(255,215,122,.8)"); gr.addColorStop(.5,"rgba(255,190,80,.28)"); gr.addColorStop(1,"rgba(255,190,80,0)");
  x.fillStyle = gr; x.fillRect(0,0,256,256);
  document.querySelector("#glow").setAttribute("src", g.toDataURL("image/png"));
  const gc = document.createElement("canvas"); gc.width = gc.height = 128;
  const y = gc.getContext("2d"), gg = y.createRadialGradient(64,64,2,64,64,64);
  gg.addColorStop(0,"rgba(255,236,170,.95)"); gg.addColorStop(.4,"rgba(255,215,122,.4)"); gg.addColorStop(1,"rgba(255,215,122,0)");
  y.fillStyle = gg; y.fillRect(0,0,128,128); window.__winGlow = gc.toDataURL("image/png");
})();


/* ============ 3 planos: nubes (fondo), fachada (medio), notas (frente) ============ */
const CAM_D = 1.6, ZF = 0.16, KF = (CAM_D - ZF) / CAM_D;   // la fachada se despega ZF; se escala KF para seguir calzando con el dibujo
document.querySelector("#backImg").setAttribute("src", "./m2_nubes.webp");
document.querySelector("#facImg").setAttribute("src", "./m2_fachada.webp");
function riseLayers() { fac.setAttribute("position", "0 0 0.003"); fac.setAttribute("scale", "1 1 1"); fac.emit("rise"); }

/* destellos: las 5 estrellas de las nubes titilan */
[[547,113],[272,207],[1033,244],[197,343],[875,113]].forEach((p, i) => {
  const e = document.createElement("a-image");
  e.setAttribute("src", window.__winGlow); e.setAttribute("width", 0.1); e.setAttribute("height", 0.1);
  e.setAttribute("position", ((p[0] - 654) / 1308) + " " + ((406.5 - p[1]) / 1308) + " 0.004");
  e.setAttribute("material", "blending:additive; transparent:true; depthWrite:false; shader:flat; opacity:0");
  e.setAttribute("animation__p", "property: material.opacity; from: 0.0; to: 0.9; dur: " + (900 + i * 260) + "; dir: alternate; loop: true; delay:" + (i * 300) + "; easing: easeInOutSine");
  twEl.appendChild(e);
});

/* una luz que late en cada ventana */
WINDOWS.forEach((w, i) => {
  const e = document.createElement("a-image");
  e.setAttribute("src", window.__winGlow); e.setAttribute("width", 0.07); e.setAttribute("height", 0.07);
  e.setAttribute("position", w[0] + " " + w[1] + " 0.004");
  e.setAttribute("material", "blending:additive; transparent:true; depthWrite:false; shader:flat; opacity:0");
  e.setAttribute("animation__p", "property: material.opacity; from: 0.05; to: 0.95; dur: 1300; dir: alternate; loop: true; delay:" + (i * 140) + "; easing: easeInOutSine");
  lightsEl.appendChild(e);
});

/* nota que sale de una ventana y vuela por toda la pantalla (se acerca a la cámara, se mece y se desvanece) */
function spawnNote(w, boost) {
  const e = document.createElement("a-entity");
  const sx = w[0] * KF, sy = w[1] * KF;
  const s = 0.02 + Math.random() * 0.032, v = Math.random() > 0.5 ? 1 : 0, dur = 4600 + Math.random() * 3200;
  const ang = (Math.random() - 0.5) * 2.5, dist = 0.5 + Math.random() * (boost ? 1.4 : 1.1);
  const ex = sx + Math.sin(ang) * dist, ey = sy + Math.cos(ang) * dist * (Math.random() > 0.15 ? 1 : -0.25);
  const ez = ZF + 0.05 + Math.random() * 0.5;
  e.setAttribute("note3d", "color: " + NOTE_COLORS[Math.floor(Math.random() * NOTE_COLORS.length)] + "; variant: " + v);
  e.setAttribute("position", sx + " " + sy + " " + (ZF + 0.012));
  e.setAttribute("scale", "0.001 0.001 0.001");
  e.setAttribute("rotation", "0 " + (Math.random() * 60 - 30) + " " + (Math.random() * 30 - 15));
  e.setAttribute("animation__up", "property: position; to: " + ex + " " + ey + " " + ez + "; dur: " + dur + "; easing: easeOutSine");
  e.setAttribute("animation__in", "property: scale; to: " + s + " " + s + " " + s + "; dur: 600; easing: easeOutBack");
  e.setAttribute("animation__out", "property: scale; to: 0.001 0.001 0.001; dur: 1000; delay: " + (dur - 1000) + "; easing: easeInQuad");
  e.setAttribute("animation__spin", "property: rotation; to: 0 " + (Math.random() > 0.5 ? 140 : -140) + " " + (Math.random() * 40 - 20) + "; dur: " + dur + "; easing: linear");
  notesEl.appendChild(e);
  setTimeout(() => e.remove(), dur + 150);
}
function noteLoop() {
  clearTimeout(noteTimer);
  if (found) spawnNote(WINDOWS[Math.floor(Math.random() * WINDOWS.length)]);
  noteTimer = setTimeout(noteLoop, playing ? 210 : 650);
}
function burstNotes() { for (let k = 0; k < 16; k++) setTimeout(() => spawnNote(WINDOWS[Math.floor(Math.random() * WINDOWS.length)], true), k * 60); }

/* mensaje según el estado de la música */
function refreshTip() {
  if (!found) return;
  if (blocked) setTip("Toca la pantalla para activar la música ♪");
  else if (userPaused) setTip("Música en pausa · toca para continuar");
  else setTip("♪ Disfruta la canción de La Cole · toca para pausar");
}

/* toque en la pantalla: pausa o continúa (y si el celular bloqueó el sonido automático, lo activa) */
window.addEventListener("click", () => {
  if (!found) return;
  if (blocked) { songPlay(); burstNotes(); }
  else if (playing) { songPause(); }
  else { songPlay(); burstNotes(); }
  if (navigator.vibrate) navigator.vibrate(30);
});

/* ---------- Carga inicial (contador suave) ---------- */
let shown = 0, tgt = 0;
function setPct(n) { pctEl.textContent = n + "%"; loadfill.style.width = n + "%"; }
const sceneTimer = setInterval(() => { if (sceneReady) tgt = 100; else tgt = Math.min(90, tgt + 2); }, 80);
setInterval(() => {
  if (shownDone) return;
  if (shown < tgt) { shown++; setPct(shown); }
  if (shown >= 100) { shownDone = true; clearInterval(sceneTimer); loadtxt.textContent = "¡Listo! ✓"; setTimeout(maybeStart, 700); }
}, 28);
function maybeStart() { if (sceneReady && shownDone && !started) startAR(); }
if (scene.hasLoaded) { sceneReady = true; } else scene.addEventListener("loaded", () => { sceneReady = true; maybeStart(); });

/* ---------- Inicio automático ---------- */
function startAR() {
  started = true;
  const st = document.querySelector("#start");
  st.style.transition = "opacity .5s"; st.style.opacity = 0;
  setTimeout(() => { st.style.display = "none"; }, 500);
  reticle.style.display = "block"; badge.style.display = "block";
  setTip("Abriendo cámara…");
  const fail = (msg, e) => {
    setTip(msg); dbg.textContent = String(e || "");
    st.style.display = "flex"; st.style.opacity = 1;
    document.querySelector("#loadwrap").style.display = "none";
    document.querySelector("#startMsg").textContent = msg;
    startBtn.style.display = "inline-block"; startBtn.textContent = "Reintentar";
    started = false;
  };
  try {
    Promise.resolve(scene.systems["mindar-image-system"].start()).then(() => {
      if (!found) setTip("Centra la fachada dentro del recuadro");
    }).catch(e => fail("No se pudo abrir la cámara. Revisa los permisos.", e));
  } catch (e) { fail("Error al iniciar. Recarga la página.", e); }
}
startBtn.addEventListener("click", () => { startBtn.style.display = "none"; startAR(); });

target.addEventListener("targetFound", () => {
  found = true; clearTimeout(lostTimer);
  reticle.classList.add("found");
  badge.classList.add("ok"); badge.textContent = "✓ ¡Imagen detectada!";
  riseLayers();
  if (!userPaused) { songPlay(); songLevel(0.9, 0.8); }
  refreshTip();
  noteLoop();
  if (navigator.vibrate) navigator.vibrate(60);
});
target.addEventListener("targetLost", () => {
  found = false;
  reticle.classList.remove("found");
  badge.classList.remove("ok"); badge.textContent = "Buscando la imagen…";
  setTip("Centra la fachada dentro del recuadro");
  clearTimeout(lostTimer); lostTimer = setTimeout(() => songLevel(0, 1.0), 2500);
});
</script>
<script src="./qrscan.js"></script>
</body>
