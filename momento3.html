<script>
/* Caja redondeada con volumen (extrusión con bisel) */
AFRAME.registerComponent("rrect", {
  schema: { w:{default:1}, h:{default:1}, r:{default:0.05}, depth:{default:0.05}, bevel:{default:0.008}, color:{default:"#fff"}, rough:{default:0.55}, metal:{default:0.1} },
  init: function () {
    const T = AFRAME.THREE, d = this.data, b = d.bevel;
    const w = d.w - 2*b, h = d.h - 2*b, r = Math.max(0.001, d.r - b), x = -w/2, y = -h/2;
    const sh = new T.Shape();
    sh.moveTo(x + r, y); sh.lineTo(x + w - r, y); sh.quadraticCurveTo(x + w, y, x + w, y + r);
    sh.lineTo(x + w, y + h - r); sh.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    sh.lineTo(x + r, y + h); sh.quadraticCurveTo(x, y + h, x, y + h - r);
    sh.lineTo(x, y + r); sh.quadraticCurveTo(x, y, x + r, y);
    const geo = new T.ExtrudeGeometry(sh, { depth: d.depth, bevelEnabled: b > 0, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 10 });
    const mat = new T.MeshStandardMaterial({ color: d.color, roughness: d.rough, metalness: d.metal });
    this.el.setObject3D("mesh", new T.Mesh(geo, mat));
  }
});
/* Destello de 4 puntas */
AFRAME.registerComponent("star4", {
  schema: { color:{default:"#ffd77a"}, inner:{default:0.22} },
  init: function () {
    const T = AFRAME.THREE, sh = new T.Shape();
    for (let k = 0; k < 8; k++) {
      const a = Math.PI/2 + k*Math.PI/4, rad = (k % 2 === 0) ? 1 : this.data.inner;
      const px = Math.cos(a)*rad, py = Math.sin(a)*rad;
      if (k === 0) sh.moveTo(px, py); else sh.lineTo(px, py);
    }
    sh.closePath();
    const mat = new T.MeshBasicMaterial({ color: this.data.color, side: T.DoubleSide, transparent: true });
    this.el.setObject3D("mesh", new T.Mesh(new T.ShapeGeometry(sh), mat));
  }
});
</script>

<body>
<div id="start">
  <h1>GRACIAS A TU ESFUERZO TU PASIÓN SE VOLVIÓ DISCIPLINA</h1>
  <p id="startMsg">Preparando la experiencia…</p>
  <div id="loadwrap">
    <div id="pct">0%</div>
    <div id="loadbar"><div id="loadfill"></div></div>
    <div id="loadtxt">Cargando…</div>
  </div>
  <button id="startBtn" style="display:none">Reintentar</button>
</div>
<div id="reticle"><div id="tip">Abriendo cámara…</div></div>
<div id="sub"><div id="subName"></div><div id="subTxt"></div></div>
<div id="badge">Buscando la imagen…</div>
<div id="debug"></div>

<a-scene id="scene"
  mindar-image="imageTargetSrc: ./momento3.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF:0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 10;"
  color-space="sRGB" renderer="colorManagement: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .hit"></a-camera>

  <!-- Marcador: ancho = 1, alto = 656/1000 = 0.656, origen = centro de la imagen -->
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.6" position="-0.5 1 1.5"></a-light>

    <a-entity id="world">
      <!-- Plano de fondo: la ilustración completa (un poco más grande que la impresión para taparla) -->
      <a-entity id="back">
        <a-image id="backImg" width="1" height="0.656" material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      </a-entity>

      <!-- Resplandores que invitan a tocar cada programa (se crean por código) -->
      <a-entity id="progs"></a-entity>

      <!-- Plano frontal: el rombo, lo más cercano al usuario -->
      <a-entity id="front" position="0 0 0.003"
        animation__rise="property: position; to: 0 0 0.15; dur: 1500; easing: easeOutElastic; startEvents: rise">
        <a-image id="diaGlow" position="0 0 -0.004" width="0.34" height="0.34" material="blending:additive; transparent:true; depthWrite:false; shader:flat; opacity:0.4"
          animation="property: scale; from: 0.85 0.85 0.85; to: 1.15 1.15 1.15; dur: 1700; dir: alternate; loop: true; easing: easeInOutSine"></a-image>
        <a-entity id="diaBob" animation="property: position; from: 0 -0.006 0; to: 0 0.008 0; dur: 2600; dir: alternate; loop: true; easing: easeInOutSine">
          <a-image id="diaImg" width="0.1135" height="0.1284" material="shader:flat; transparent:true; alphaTest:0.01"
            animation__r="property: rotation; from: 0 0 -3; to: 0 0 3; dur: 3200; dir: alternate; loop: true; easing: easeInOutSine"></a-image>
        </a-entity>
        <a-image id="diaFlare" position="0 0.028 0.004" width="0.16" height="0.16" material="blending:additive; transparent:true; depthWrite:false; shader:flat; opacity:0"
          animation="property: material.opacity; from: 0; to: 0.55; dur: 1100; dir: alternate; loop: true; easing: easeInOutSine"></a-image>
      </a-entity>
      <a-entity id="burst"></a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
/* ============ Programas: posición sobre la ilustración, frase, color y música ============
   Coordenadas: ancho de la imagen = 1, origen en el centro, +y hacia arriba. */
const PROGS = [
  { name: "Estilismo Integral", x: -0.014, y:  0.166, color: "#ffd77a",
    phrase: "Cada mechón cuenta una historia, y hoy tú la escribes con tus propias manos." },
  { name: "Maquillaje Social y Decorativo", x: -0.226, y:  0.004, color: "#f0abfc",
    phrase: "Descubriste que el color no se aplica... se siente. Tu talento ya brilla." },
  { name: "Cosmetología y Estética", x: 0.204, y: 0.004, color: "#a5f3fc",
    phrase: "Aprendiste a cuidar lo más humano: la piel, la confianza y el bienestar de los demás." },
  { name: "Cuidado Estético de Manos y Pies", x: -0.014, y: -0.152, color: "#ffffff",
    phrase: "Con detalle, paciencia y cariño, convertiste cada paso en un arte." }
];

/* ============ Música (sintetizada; es un reemplazo hasta tener las canciones reales) ============ */
const mf = (m) => 440 * Math.pow(2, (m - 69) / 12);
const THEMES = [
  { tempo: 116, wave: "triangle", dec: 0.5, bell: false,
    steps: [72,76,79,76,74,77,81,77,72,76,79,84,83,79,76,74],
    pads: [[48,55,64],[45,52,60],[41,48,57],[43,50,59]] },
  { tempo: 84, wave: "sine", dec: 1.6, bell: true,
    steps: [81,null,76,null,79,null,83,null,81,null,74,null,76,null,72,null],
    pads: [[45,52,60],[41,48,57],[48,55,60],[43,50,59]] },
  { tempo: 64, wave: "sine", dec: 2.4, bell: false,
    steps: [74,null,null,78,null,null,81,null,79,null,null,76,null,null,73,null],
    pads: [[50,57,61,66],[47,54,59,62],[43,50,54,59],[45,52,57,61]] },
  { tempo: 104, wave: "triangle", dec: 0.28, bell: false,
    steps: [79,83,86,83,79,83,88,86,84,81,84,88,86,83,79,83],
    pads: [[43,50,59],[48,55,64],[40,47,55],[50,57,62]] }
];
let ac = null, master = null, cur = -1, curNode = null, curTimer = null;
function audioInit() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  }
  if (ac.state === "suspended") ac.resume();
}
function tone(dest, freq, t, dur, type, vol, atk) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function startTheme(i) {
  audioInit();
  if (cur === i) return;
  // salida suave del tema anterior
  if (curNode) {
    const old = curNode, oldT = curTimer, now = ac.currentTime;
    old.gain.cancelScheduledValues(now); old.gain.setValueAtTime(old.gain.value, now); old.gain.linearRampToValueAtTime(0, now + 1.2);
    setTimeout(() => { clearInterval(oldT); old.disconnect(); }, 1400);
  }
  cur = i;
  const th = THEMES[i], node = ac.createGain();
  node.gain.setValueAtTime(0, ac.currentTime); node.gain.linearRampToValueAtTime(1, ac.currentTime + 1.2);
  node.connect(master); curNode = node;
  const stepDur = 60 / th.tempo / 2;
  let step = 0, next = ac.currentTime + 0.1;
  const tick = () => {
    while (next < ac.currentTime + 0.5) {
      const n = th.steps[step % th.steps.length];
      if (n != null) {
        tone(node, mf(n), next, th.dec, th.wave, 0.16, 0.012);
        if (th.bell) tone(node, mf(n) * 2.01, next, th.dec * 0.7, "sine", 0.05, 0.01);
      }
      if (step % 8 === 0) {
        const chord = th.pads[Math.floor(step / 8) % th.pads.length];
        chord.forEach(m => tone(node, mf(m), next, stepDur * 8.5, "sine", 0.05, 0.6));
      }
      next += stepDur; step++;
    }
  };
  tick(); curTimer = setInterval(tick, 150);
}
function musicLevel(v, secs) {
  if (!ac || !master) return;
  const now = ac.currentTime;
  master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value, now);
  master.gain.linearRampToValueAtTime(v, now + secs);
}
window.addEventListener("pointerdown", audioInit, { passive: true });
</script>

<script>
const scene = document.querySelector("#scene");
const target = document.querySelector("#target");
const world = document.querySelector("#world");
const progs = document.querySelector("#progs");
const burst = document.querySelector("#burst");
const tip = document.querySelector("#tip");
const reticle = document.querySelector("#reticle"), badge = document.querySelector("#badge");
const dbg = document.querySelector("#debug");
const startBtn = document.querySelector("#startBtn");
const pctEl = document.querySelector("#pct"), loadfill = document.querySelector("#loadfill"), loadtxt = document.querySelector("#loadtxt");
const TIP_MSG = "Toca cada programa para escuchar un mensaje";
let speaking = false;                                    // mientras habla la voz se ven los subtítulos y se oculta el tooltip
const setTip = (html) => { tip.innerHTML = html; tip.style.display = speaking ? "none" : ""; };

let found = false, started = false, sceneReady = false, shownDone = false, lostTimer = null, active = -1;
const touched = new Set();

/* ---------- Construcción de los 4 programas ---------- */


/* ============ Profundidad: 2 planos (ilustración al fondo, rombo al frente) ============ */
const CAM_D = 1.6, AP = 1.04;                              // AP: cuánto más grande que la impresión se ve la ilustración
const fz = (z) => AP * (CAM_D - z) / CAM_D;                // factor para que un objeto a profundidad z calce con el dibujo
const BACK_Z = -0.05, FRONT_Z = 0.15, GLOW_Z = 0.02;
document.querySelector("#backImg").setAttribute("src", "./m3_fondo.webp");
document.querySelector("#diaImg").setAttribute("src", "./m3_rombo.webp");
const backEl = document.querySelector("#back"), frontEl = document.querySelector("#front");
backEl.setAttribute("position", "0 0 " + BACK_Z); backEl.setAttribute("scale", fz(BACK_Z) + " " + fz(BACK_Z) + " 1");
const DIA = { x: -0.0131, y: 0.01216 };                    // centro del rombo sobre la ilustración
const KF = fz(FRONT_Z);
frontEl.setAttribute("scale", KF + " " + KF + " " + KF);
frontEl.dataset.px = DIA.x * KF; frontEl.dataset.py = DIA.y * KF;
frontEl.setAttribute("position", frontEl.dataset.px + " " + frontEl.dataset.py + " 0.003");
frontEl.setAttribute("animation__rise", "property: position; to: " + frontEl.dataset.px + " " + frontEl.dataset.py + " " + FRONT_Z + "; dur: 1500; easing: easeOutElastic; startEvents: rise");
function riseLayers() { frontEl.setAttribute("position", frontEl.dataset.px + " " + frontEl.dataset.py + " 0.003"); frontEl.emit("rise"); }

/* texturas de luz */
function glowTex(color, ring) {
  const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d");
  if (ring) { x.strokeStyle = color; x.lineWidth = 7; x.shadowColor = color; x.shadowBlur = 18; x.beginPath(); x.arc(128, 128, 96, 0, Math.PI * 2); x.stroke(); }
  else { const g = x.createRadialGradient(128, 128, 4, 128, 128, 128); g.addColorStop(0, color); g.addColorStop(.35, color + "66"); g.addColorStop(1, color + "00"); x.fillStyle = g; x.fillRect(0, 0, 256, 256); }
  return c.toDataURL("image/png");
}
document.querySelector("#diaGlow").setAttribute("src", glowTex("#ffffff"));
document.querySelector("#diaFlare").setAttribute("src", glowTex("#e9ddff"));

const glowEls = [], rippleEls = [];
PROGS.forEach((p, i) => {
  const f = fz(GLOW_Z);
  const g = document.createElement("a-entity");
  g.setAttribute("position", (p.x * f) + " " + (p.y * f) + " " + GLOW_Z);

  const hit = document.createElement("a-plane");               // zona táctil invisible
  hit.setAttribute("class", "hit"); hit.setAttribute("width", 0.3); hit.setAttribute("height", 0.27);
  hit.setAttribute("material", "shader:flat; transparent:true; opacity:0; depthWrite:false");
  hit.addEventListener("click", () => selectProg(i));
  g.appendChild(hit);

  const gl = document.createElement("a-image");                // resplandor que respira
  gl.setAttribute("src", glowTex(p.color)); gl.setAttribute("width", 0.3); gl.setAttribute("height", 0.3);
  gl.setAttribute("position", "0 0 0.002");
  gl.setAttribute("material", "blending:additive; transparent:true; depthWrite:false; shader:flat; opacity:0.05");
  gl.setAttribute("animation__p", "property: material.opacity; from: 0.04; to: 0.24; dur: 1500; dir: alternate; loop: true; delay:" + (i * 350) + "; easing: easeInOutSine");
  g.appendChild(gl); glowEls.push(gl);

  const rp = document.createElement("a-image");                // onda "toca aquí"
  rp.setAttribute("src", glowTex(p.color, true)); rp.setAttribute("width", 0.2); rp.setAttribute("height", 0.2);
  rp.setAttribute("position", "0 0 0.004");
  rp.setAttribute("material", "blending:additive; transparent:true; depthWrite:false; shader:flat; opacity:0");
  rp.setAttribute("animation__s", "property: scale; from: 0.35 0.35 0.35; to: 1.5 1.5 1.5; dur: 2200; delay:" + (i * 500) + "; loop: true; easing: easeOutQuad");
  rp.setAttribute("animation__o", "property: material.opacity; from: 0.9; to: 0; dur: 2200; delay:" + (i * 500) + "; loop: true; easing: easeInQuad");
  g.appendChild(rp); rippleEls.push(rp);

  progs.appendChild(g);
});

/* destello al tocar: unos puntos de luz que se dispersan */
function sparkBurst(p) {
  const f = fz(GLOW_Z);
  const fl = document.createElement("a-image");
  fl.setAttribute("src", glowTex(p.color)); fl.setAttribute("width", 0.34); fl.setAttribute("height", 0.34);
  fl.setAttribute("position", (p.x * f) + " " + (p.y * f) + " " + (GLOW_Z + 0.01));
  fl.setAttribute("material", "blending:additive; transparent:true; depthWrite:false; shader:flat; opacity:0.6");
  fl.setAttribute("animation__s", "property: scale; from: 0.4 0.4 0.4; to: 1.7 1.7 1.7; dur: 700; easing: easeOutCubic");
  fl.setAttribute("animation__o", "property: material.opacity; from: 0.6; to: 0; dur: 700; easing: easeInQuad");
  burst.appendChild(fl); setTimeout(() => fl.remove(), 800);
  for (let k = 0; k < 10; k++) {
    const d = document.createElement("a-image"), a = Math.random() * Math.PI * 2, dist = 0.07 + Math.random() * 0.1, sz = 0.02 + Math.random() * 0.02;
    d.setAttribute("src", glowTex(k % 2 ? "#ffd77a" : p.color)); d.setAttribute("width", sz); d.setAttribute("height", sz);
    d.setAttribute("position", (p.x * f) + " " + (p.y * f) + " " + (GLOW_Z + 0.02));
    d.setAttribute("material", "blending:additive; transparent:true; depthWrite:false; shader:flat; opacity:1");
    d.setAttribute("animation__m", "property: position; to: " + (p.x * f + Math.cos(a) * dist) + " " + (p.y * f + Math.sin(a) * dist) + " " + (GLOW_Z + 0.05) + "; dur: 1000; easing: easeOutCubic");
    d.setAttribute("animation__o", "property: material.opacity; from: 1; to: 0; dur: 1000; easing: easeInQuad");
    burst.appendChild(d); setTimeout(() => d.remove(), 1100);
  }
}

/* ============ Voz + subtítulos ============
   Por defecto habla la voz en español del celular. Para usar locuciones grabadas, escribe la ruta de cada audio en VOICE_URLS
   (por ejemplo "./voz_cabello.mp3") y se usarán en lugar de la voz del celular. */
const VOICE_URLS = ["./voz_estilismo.mp3", "./voz_maquillaje.mp3", "./voz_cosmetologia.mp3", "./voz_manos.mp3"];
const subEl = document.querySelector("#sub"), subName = document.querySelector("#subName"), subTxt = document.querySelector("#subTxt");
let voiceAudio = null, subTimer = null, subHide = null, pickedVoice = null;
function pickVoice() {
  if (!window.speechSynthesis) return null;
  const vs = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  if (!vs.length) return null;
  const score = v => (/CO|MX|US|419/i.test(v.lang) ? 3 : /ES/i.test(v.lang) ? 1 : 0) + (/google|natural|neural|paulina|sabina|monica|m[oó]nica|helena|sof[ií]a|female/i.test(v.name) ? 2 : 0);
  return vs.sort((a, b) => score(b) - score(a))[0];
}
if (window.speechSynthesis) { speechSynthesis.onvoiceschanged = () => { pickedVoice = pickVoice(); }; pickedVoice = pickVoice(); }
function stopVoice() {
  clearInterval(subTimer); clearTimeout(subHide);
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (voiceAudio) { voiceAudio.pause(); voiceAudio = null; }
  subEl.classList.remove("on");
  speaking = false; tip.style.display = "";
}
function speak(i) {
  stopVoice();
  const p = PROGS[i], words = p.phrase.split(/\s+/);
  subName.textContent = p.name;
  subTxt.innerHTML = words.map(w => "<span>" + w + "</span>").join(" ");
  const spans = subTxt.querySelectorAll("span");
  subEl.classList.add("on");
  speaking = true; tip.style.display = "none";
  let lit = 0, startedAt = performance.now(), ended = false;
  const light = (n) => { while (lit < Math.min(n, spans.length)) spans[lit++].classList.add("lit"); };
  let estTotal = p.phrase.length * 72 + 600;                        // estimación por si no hay aviso palabra por palabra
  const finish = () => {
    if (ended) return; ended = true; clearInterval(subTimer); light(spans.length);
    musicLevel(0.9, 0.8);
    subHide = setTimeout(() => { subEl.classList.remove("on"); speaking = false; setTip(TIP_MSG); }, 450);   // el tiempo lo marca el final de la voz
  };
  subTimer = setInterval(() => {
    light(Math.floor(((performance.now() - startedAt) / estTotal) * spans.length));
    if (performance.now() - startedAt > estTotal + 4000) finish();
  }, 120);
  musicLevel(0.22, 0.4);                                            // la música baja mientras habla la voz
  const viaTTS = () => {
    if (ended) return;
    startedAt = performance.now(); estTotal = p.phrase.length * 72 + 600;
    if (!window.speechSynthesis) { setTimeout(finish, estTotal); return; }
    const u = new SpeechSynthesisUtterance(p.name + ". " + p.phrase);
    u.lang = pickedVoice ? pickedVoice.lang : "es-CO"; if (pickedVoice) u.voice = pickedVoice;
    u.rate = 0.92; u.pitch = 1.02; u.volume = 1;
    u.onboundary = (e) => { const k = (p.name + ". " + p.phrase).slice(0, e.charIndex).split(/\s+/).filter(Boolean).length - p.name.split(/\s+/).length; if (k >= 0) light(k + 1); };
    u.onend = finish; u.onerror = finish;
    speechSynthesis.speak(u);
  };
  if (VOICE_URLS[i]) {                                              // locución grabada; si no carga, habla la voz del celular
    const au = new Audio(VOICE_URLS[i]); voiceAudio = au; au.volume = 1;
    let bad = false; const fallback = () => { if (bad) return; bad = true; if (voiceAudio === au) voiceAudio = null; viaTTS(); };
    au.onerror = fallback; au.onended = finish;
    au.onloadedmetadata = () => {
      if (!isFinite(au.duration) || au.duration < 1) { fallback(); return; }
      const lead = Math.min(1600, p.name.length * 62);               // al inicio la voz dice el nombre del programa
      startedAt = performance.now() + lead; estTotal = Math.max(1200, au.duration * 1000 - lead - 500);
    };
    const pr = au.play(); if (pr && pr.catch) pr.catch(fallback);
  } else viaTTS();
}

function selectProg(i) {
  if (!found) return;
  audioInit();
  active = i; touched.add(i);
  const p = PROGS[i];
  glowEls.forEach((gl, k) => {                                    // el elegido brilla fuerte; los demás quedan suaves
    gl.removeAttribute("animation__p");
    gl.setAttribute("animation__p", k === i
      ? "property: material.opacity; from: 0.3; to: 0.55; dur: 1200; dir: alternate; loop: true; easing: easeInOutSine"
      : "property: material.opacity; from: 0.03; to: 0.14; dur: 1500; dir: alternate; loop: true; delay:" + (k * 300) + "; easing: easeInOutSine");
  });
  sparkBurst(p);
  startTheme(i);
  musicLevel(0.9, 0.3);
  speak(i);
  if (navigator.vibrate) navigator.vibrate(30);
}

/* ---------- Carga inicial (contador suave) ---------- */
let shown = 0, tgt = 0;
function setPct(n) { pctEl.textContent = n + "%"; loadfill.style.width = n + "%"; }
const sceneTimer = setInterval(() => { if (sceneReady) tgt = 100; else tgt = Math.min(90, tgt + 2); }, 80);
setInterval(() => {
  if (shownDone) return;
  if (shown < tgt) { shown++; setPct(shown); }
  if (shown >= 100) { shownDone = true; clearInterval(sceneTimer); loadtxt.textContent = "¡Listo! ✓"; setTimeout(maybeStart, 700); }
}, 28);
function maybeStart() { if (sceneReady && shownDone && !started) startAR(); }
if (scene.hasLoaded) { sceneReady = true; } else scene.addEventListener("loaded", () => { sceneReady = true; maybeStart(); });

/* ---------- Inicio automático ---------- */
function startAR() {
  started = true;
  const st = document.querySelector("#start");
  st.style.transition = "opacity .5s"; st.style.opacity = 0;
  setTimeout(() => { st.style.display = "none"; }, 500);
  reticle.style.display = "block"; badge.style.display = "block";
  setTip("Abriendo cámara…");
  const fail = (msg, e) => {
    setTip(msg); dbg.textContent = String(e || "");
    st.style.display = "flex"; st.style.opacity = 1;
    document.querySelector("#loadwrap").style.display = "none";
    document.querySelector("#startMsg").textContent = msg;
    startBtn.style.display = "inline-block"; startBtn.textContent = "Reintentar";
    started = false;
  };
  try {
    Promise.resolve(scene.systems["mindar-image-system"].start()).then(() => {
      if (!found) setTip("Centra la ilustración de los 4 programas dentro del recuadro");
    }).catch(e => fail("No se pudo abrir la cámara. Revisa los permisos.", e));
  } catch (e) { fail("Error al iniciar. Recarga la página.", e); }
}
startBtn.addEventListener("click", () => { startBtn.style.display = "none"; startAR(); });

target.addEventListener("targetFound", () => {
  found = true; clearTimeout(lostTimer);
  reticle.classList.add("found");
  badge.classList.add("ok"); badge.textContent = "✓ ¡Imagen detectada!";
  riseLayers();
  setTip(TIP_MSG);
  if (active >= 0) musicLevel(0.9, 0.8);
  if (navigator.vibrate) navigator.vibrate(60);
});
target.addEventListener("targetLost", () => {
  found = false; stopVoice();
  reticle.classList.remove("found");
  badge.classList.remove("ok"); badge.textContent = "Buscando la imagen…";
  setTip("Centra la ilustración de los 4 programas dentro del recuadro");
  clearTimeout(lostTimer); lostTimer = setTimeout(() => musicLevel(0, 1.0), 2500);   // la música se apaga si se aleja la imagen
});
</script>
<script src="./qrscan.js"></script>
